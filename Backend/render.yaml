# Render Blueprint — AI Idea Researcher Backend
services:
  - type: web
    name: ai-idea-researcher-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-idea-researcher-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: OPENROUTER_MODEL
        sync: false
      - key: SEARCH_PROVIDER
        value: google
      - key: SEARCH_API_KEY
        sync: false
      - key: SEARCH_ENGINE_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false

databases:
  - name: ai-idea-researcher-db
    plan: free
    databaseName: ai_idea_researcher
    user: ai_researcher
